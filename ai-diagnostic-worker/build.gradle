plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

dependencies {
    // Shared common module
    implementation project(':common')

    // System connectivity & Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Spring AI: 1.1.8 (latest 1.1.x, Boot 3.5.x line) on Spring Boot 3.5.13 (root build).
    // Spring AI 2.x targets Boot 4 - do not bump past 1.1.x without a Boot upgrade.
    // OpenAI starter / OpenAiEmbeddingService decision is deferred (0F.16 / A2.10).
    implementation platform("org.springframework.ai:spring-ai-bom:1.1.8")
    implementation "org.springframework.ai:spring-ai-starter-model-ollama"

    // Database & Flyway
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Developer Utilities
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Testing Suite (Spring Boot BOM manages versions for Testcontainers & Awaitility)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.awaitility:awaitility'
}

tasks.named('test') {
    useJUnitPlatform()
}