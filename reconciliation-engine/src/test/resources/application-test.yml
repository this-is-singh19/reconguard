server:
  port: 0

spring:
  application:
    name: reconciliation-service-test

  datasource:
    url: jdbc:h2:mem:reconguard_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  # Disable Flyway for embedded H2 tests
  flyway:
    enabled: false

  data:
    redis:
      repositories:
        enabled: false

reconguard:
  topics:
    raw-transactions: reconguard.transactions.raw
    failed-transactions: reconguard.transactions.failures
    matching:
      amount-tolerance: 0.02
      timestamp-tolerance: 120s

