plugins {
    id 'java'
    id 'io.spring.dependency-management'
}

jar {
    enabled = true
}

// Single version source: same Boot BOM as the root build (3.5.13), no manual pins.
dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.13'
    }
}

dependencies {
    // Validation annotations on the shared records
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Web/servlet/logback types used by TenantInterceptor, MdcFilter, MaskingConverter.
    // Provided by consumers (ingestion-service, reconciliation-engine, ai-diagnostic-worker);
    // common must not pull starter-web itself.
    compileOnly 'org.springframework:spring-webmvc'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    compileOnly 'ch.qos.logback:logback-classic'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'ch.qos.logback:logback-classic'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
