services:
  postgres:
    image: 'pgvector/pgvector:pg16'
    container_name: reconguard-postgres
    environment:
      - 'POSTGRES_DB=reconguard_db'
      - 'POSTGRES_USER=reconguard_admin'
      - 'POSTGRES_PASSWORD=reconguard_secure_pass'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconguard_admin -d reconguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:7.2-alpine'
    container_name: reconguard-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: 'confluentinc/cp-kafka:7.6.0'
    container_name: reconguard-kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,TRACK:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,TRACK://kafka:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REREPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,TRACK://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'TRACK'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  ollama:
    image: 'ollama/ollama:latest'
    container_name: reconguard-ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_models:/root/.ollama

  zipkin:
    image: 'openzipkin/zipkin:latest'
    container_name: reconguard-zipkin
    ports:
      - '9411:9411'

volumes:
  pgdata:
  redisdata:
  ollama_models: